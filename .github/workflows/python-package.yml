name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    # Python 3.9 builds are available for 24.04; keep this stable as
    # ubuntu-latest moves to newer releases without older Python builds.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . flake8 pytest
      - name: Check syntax and undefined names
        run: python -m flake8 ticket.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest
        run: python -m pytest -q
      - name: Check installed command
        run: |
          ticket --version
          ticket config
